ekf_filter_node:
  ros__parameters:

    use_sim_time: true

    frequency: 30.0
    sensor_timeout: 0.2

    two_d_mode: true

    publish_tf: true
    publish_acceleration: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Raw Gazebo odometry
    odom0: /odom

    # Order:
    # x, y, z,
    # roll, pitch, yaw,
    # vx, vy, vz,
    # vroll, vpitch, vyaw,
    # ax, ay, az
    #
    # Χρησιμοποιούμε απευθείας:
    # x
    # y
    # yaw
    odom0_config: [
      true,  true,  false,
      false, false, true,
      false, false, false,
      false, false, false,
      false, false, false
    ]

    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    transform_time_offset: 0.0
    transform_timeout: 0.0

    print_diagnostics: true
